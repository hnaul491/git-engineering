name: Git Hub Actions Demo
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Say Hello
        run: echo "Hello, GitHub Actions!"
        shell: bash
  goodbye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Say Goodbye
        run: echo "Goodbye, GitHub Actions!"
        shell: bash
