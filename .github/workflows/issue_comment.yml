name: Create a comment on an issue
on:
  issues:
    types: [opened]

jobs:
  comment-with-action:
    runs-on: ubuntu-latest
    steps:
      - name: Create a comment on the issue
        run: echo '${{ toJson(github.event) }}'
        shell: bash
  comment-with-api:
    runs-on: ubuntu-latest
    steps:
      - name: Create a comment on the issue using GitHub API
        run: echo '${{ toJson(github.event) }} - Creating with GitHub API'
        shell: bash
