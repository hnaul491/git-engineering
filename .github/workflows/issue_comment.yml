name: Create a comment on an issue
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  comment-with-action:
    runs-on: ubuntu-latest
    steps:
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{github.event.issue.number}}
          body: |
            This is a multi-line test comment
            - With GitHub **Markdown** :sparkles:
            - Created by [create-or-update-comment][1]

            [1]: https://github.com/peter-evans/create-or-update-comment
          reactions: '+1'
  comment-with-api:
    runs-on: ubuntu-latest
    steps:
      - name: print the github token
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}"
      - name: print the user name
        run: echo "USER_NAME=${{ github.event.issue.user.login }}"
      - name: print the repository name
        run: echo "REPOSITORY_NAME=${{ github.event.repository.name }}"
      - name: Create a comment on the issue using GitHub API
        run: |
          gh api \
          --method POST \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          /repos/${ORGANIZATION}/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments \
          -f 'body=Me too'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORGANIZATION: ${{ github.event.repository.owner.login }}
          REPOSITORY: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
